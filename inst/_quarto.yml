project:
  type: book
  output-dir: docs
  post-render: assets/post-render.R
  ## Lecture slides are embedded in `<iframe>`s, which quarto does not scan for
  ## resources: copy every PDF to the rendered book explicitly
  resources:
    - "pages/**/*.pdf"

metadata-files:
  - assets/_book.yml
  - assets/_website.yml
  - assets/_format.yml
  - assets/_knitr.yml

filters:
  - extensions/tools-tabset-ext/tools-tabset.lua
